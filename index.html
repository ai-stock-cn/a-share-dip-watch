<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A股自选股当日跌幅与静态股息率看板"
    />
    <meta name="theme-color" content="#17201c" />
    <title>A股价值投资</title>
    <link rel="stylesheet" href="./styles.css?v=53" />
    <script defer src="./auth.js?v=2"></script>
    <script defer src="./live-market.js?v=34"></script>
    <script defer src="./app.js?v=65"></script>
  </head>
  <body class="auth-locked">
    <section id="authGate" class="auth-gate" aria-labelledby="authTitle">
      <div class="auth-panel">
        <div class="auth-heading">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="auth-kicker">A股价值投资</p>
            <h1 id="authTitle">账号验证</h1>
          </div>
        </div>
        <form id="loginForm" class="auth-form" novalidate>
          <label for="loginUsername">账号</label>
          <input
            id="loginUsername"
            name="username"
            type="text"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
          />
          <label for="loginPassword">密码</label>
          <input
            id="loginPassword"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
          <label class="auth-remember" for="rememberLogin">
            <input id="rememberLogin" type="checkbox" checked />
            <span>30 天内保持登录</span>
          </label>
          <p id="loginError" class="auth-error" role="alert" aria-live="polite"></p>
          <button id="loginButton" class="primary-button auth-submit" type="submit">
            <span>登录</span>
          </button>
        </form>
        <p class="auth-session-note">仅保存登录状态，不保存明文密码</p>
      </div>
    </section>

    <header class="app-header">
      <div class="header-inner">
        <div class="brand-block">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>A股价值投资</h1>
            <p id="marketStatus" class="market-status">正在读取行情</p>
          </div>
        </div>
        <div class="header-actions">
          <button
            id="logoutButton"
            class="icon-button"
            type="button"
            title="退出登录"
            aria-label="退出登录"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 17l5-5-5-5" />
              <path d="M15 12H3" />
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
            </svg>
          </button>
          <button
            id="refreshButton"
            class="icon-button"
            type="button"
            title="刷新行情"
            aria-label="刷新行情"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 0 0-15.2-6.2L3 8" />
              <path d="M3 3v5h5" />
              <path d="M3 12a9 9 0 0 0 15.2 6.2L21 16" />
              <path d="M16 16h5v5" />
            </svg>
          </button>
          <button id="addButton" class="primary-button" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M5 12h14" /><path d="M12 5v14" /></svg>
            <span>添加股票</span>
          </button>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section class="summary-strip" aria-label="自选股概览">
        <div>
          <span class="summary-label">自选股</span>
          <strong id="stockCount">--</strong>
        </div>
        <div>
          <span class="summary-label">跌超 5%</span>
          <button id="severeDeclineShortcut" class="summary-count-button" type="button" title="查看跌超 5% 的股票" aria-label="查看跌超 5% 的股票">
            <strong id="severeDeclineCount">--</strong>
          </button>
        </div>
        <div>
          <span class="summary-label">跌超 3%</span>
          <button id="alertShortcut" class="summary-count-button" type="button" title="查看跌超 3% 的股票" aria-label="查看跌超 3% 的股票">
            <strong id="alertCount">--</strong>
          </button>
        </div>
        <div class="summary-time">
          <span class="summary-label">行情时间（北京时间）</span>
          <strong id="updatedAt">--</strong>
        </div>
      </section>

      <section id="watchlistSection" class="watchlist-section" aria-labelledby="watchlistTitle">
        <div class="section-heading">
          <h2 id="watchlistTitle">今日表现</h2>
          <div class="legend" aria-label="跌幅颜色说明">
            <span><i class="legend-dot moderate"></i>跌 3%+</span>
            <span><i class="legend-dot severe"></i>跌 5%+</span>
          </div>
        </div>

        <div class="filter-bar" aria-label="股票筛选与分页设置">
          <div class="filter-group">
            <label class="control-field stock-search-field" for="stockListSearch">
              <span>股票查询</span>
              <span class="stock-search-control">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="7" />
                  <path d="m20 20-4-4" />
                </svg>
                <input
                  id="stockListSearch"
                  type="search"
                  placeholder="名称、代码、行业或性质"
                  autocomplete="off"
                  spellcheck="false"
                  aria-label="按股票名称、代码、行业或企业性质筛选"
                />
              </span>
            </label>
            <label class="star-filter-control" for="starredOnlyFilter" title="仅显示已关注的股票">
              <input id="starredOnlyFilter" type="checkbox" />
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="m12 2.7 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5-5.8-3.1-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9Z" />
              </svg>
              <span>仅看星标</span>
              <strong id="starredFilterCount" aria-label="已关注数量">0</strong>
            </label>
            <label class="control-field" for="periodFilter">
              <span>跌幅范围</span>
              <select id="periodFilter">
                <option value="daily">当日跌幅</option>
                <option value="threeMonth">近3个月累计</option>
                <option value="largestDaily">今日创近3月最大</option>
              </select>
            </label>
            <label class="control-field" for="thresholdFilter">
              <span>跌幅门槛</span>
              <select id="thresholdFilter">
                <option value="0">全部</option>
                <option value="2.5">2.5% 以上</option>
                <option value="3">3% 以上</option>
                <option value="4">4% 以上</option>
                <option value="5">5% 以上</option>
              </select>
            </label>
            <label class="control-field sort-order-field" for="sortOrder">
              <span>排序</span>
              <select id="sortOrder">
                <option value="decline">跌幅优先</option>
                <option value="rise">涨幅优先</option>
                <option value="currentPriceAscending">当前股价升序</option>
                <option value="currentPriceDescending">当前股价降序</option>
                <option value="bollAscending" selected>下轨距离升序</option>
                <option value="bollDescending">下轨距离降序</option>
                <option value="twoYearLowAscending">两年低价距离 ↑</option>
                <option value="twoYearLowDescending">两年低价距离 ↓</option>
                <option value="ma250Ascending">距年线（MA250）升序</option>
                <option value="ma250Descending">距年线（MA250）降序</option>
                <option value="trackPositionAscending">一年位置：低 → 高</option>
                <option value="trackPositionDescending">一年位置：高 → 低</option>
              </select>
            </label>
            <label class="control-field two-year-low-filter-field" for="twoYearLowFilter" title="今年+去年两年的最低价；与其他筛选条件同时生效，数据不足时不纳入距离筛选">
              <span>距两年低价</span>
              <select id="twoYearLowFilter">
                <option value="all">全部距离</option>
                <option value="below">低于低价（&lt;0%）</option>
                <option value="5">0～+5%</option>
                <option value="10">0～+10%</option>
                <option value="20">0～+20%</option>
              </select>
            </label>
            <label class="control-field ma250-filter-field" for="ma250Filter" title="当前股价相对 MA250 年线的位置；与其他筛选条件同时生效">
              <span>年线位置</span>
              <select id="ma250Filter">
                <option value="all">全部位置</option>
                <option value="above">股价在年线上</option>
                <option value="below">股价在年线下</option>
              </select>
            </label>
            <div class="control-field price-track-filter-field" title="当前股价在近一年最低价与最高价区间中的位置；最多同时选择两个位置，并与其他筛选条件同时生效">
              <span id="priceTrackFilterLabel">价格位置</span>
              <div id="priceTrackFilter" class="multi-select">
                <button id="priceTrackFilterButton" class="multi-select-trigger" type="button" aria-haspopup="true" aria-expanded="false" aria-labelledby="priceTrackFilterLabel priceTrackFilterValue">
                  <span id="priceTrackFilterValue">全部位置</span>
                  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m7 10 5 5 5-5" /></svg>
                </button>
                <div id="priceTrackFilterMenu" class="multi-select-menu" role="group" aria-label="价格位置选项" hidden>
                  <label class="multi-select-option"><input type="checkbox" name="priceTrackFilter" value="low" /><span>低位</span></label>
                  <label class="multi-select-option"><input type="checkbox" name="priceTrackFilter" value="middle" /><span>中位</span></label>
                  <label class="multi-select-option"><input type="checkbox" name="priceTrackFilter" value="high" /><span>高位</span></label>
                  <small>最多选择 2 个</small>
                </div>
              </div>
            </div>
            <label class="control-field dividend-years-filter-field" for="dividendYearsFilter" title="按截至最新完整报告年度的连续正分红年数筛选；当前数据窗口为近 10 年">
              <span>连续分红</span>
              <select id="dividendYearsFilter">
                <option value="all">全部年限</option>
                <option value="10plus">10 年以上</option>
              </select>
            </label>
            <label class="control-field" for="industryFilter">
              <span>行业</span>
              <select id="industryFilter">
                <option value="all">全部行业</option>
              </select>
            </label>
            <label class="control-field" for="enterpriseNatureFilter">
              <span>企业性质</span>
              <select id="enterpriseNatureFilter">
                <option value="all">全部性质</option>
              </select>
            </label>
            <label class="control-field compact" for="bollPeriodFilter">
              <span>BOLL 周期</span>
              <select id="bollPeriodFilter">
                <option value="day">日线</option>
                <option value="week">周线</option>
                <option value="month">月线</option>
              </select>
            </label>
            <label class="control-field compact" for="bollBandFilter">
              <span>BOLL 轨道</span>
              <select id="bollBandFilter">
                <option value="all">全部</option>
                <option value="lower">下轨</option>
                <option value="middle">中轨</option>
                <option value="upper">上轨</option>
              </select>
            </label>
            <label class="control-field compact" for="weeklyMiddleFilter" title="当前股价相对周线 BOLL 中轨的位置；与其他筛选条件同时生效">
              <span>周中位置</span>
              <select id="weeklyMiddleFilter">
                <option value="all">全部</option>
                <option value="above">周中线上</option>
                <option value="below">周中线下</option>
              </select>
            </label>
            <button id="resetFiltersButton" class="reset-filters-button" type="button" title="清空当前筛选条件并恢复默认排序">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 3-6.7" />
                <path d="M3 4v6h6" />
              </svg>
              <span>重置筛选</span>
            </button>
          </div>
          <div class="page-settings">
            <span id="resultCount" class="result-count">-- 只</span>
            <label class="control-field compact" for="pageSizeSelect">
              <span>每页</span>
              <select id="pageSizeSelect">
                <option value="10">10 条</option>
                <option value="50" selected>50 条</option>
                <option value="100">100 条</option>
              </select>
            </label>
          </div>
        </div>

        <div class="table-shell">
          <table>
            <thead>
              <tr>
                <th scope="col">股票</th>
                <th scope="col" class="weekly-boll-column" title="周线 BOLL(20, 2σ) 下轨、中轨和上轨，保留三位小数">周线 BOLL</th>
                <th scope="col" class="history-yield-column">历史股息率</th>
                <th scope="col" class="annual-low-column" title="按前复权日 K 的最低价统计；本年为截至数据日期的年内最低价；现价较低价 =（当前价 ÷ 该低价 − 1）× 100%">近三年最低价</th>
                <th id="changeHeader" scope="col" class="numeric change-column" aria-sort="ascending">
                  <button id="changeSortButton" class="column-sort-button" type="button">
                    <span id="changeHeaderLabel">当日涨跌幅</span>
                    <span id="changeSortIcon" class="column-sort-icon" aria-hidden="true">↑</span>
                  </button>
                </th>
                <th scope="col" class="numeric current-price-column">当前股价</th>
                <th scope="col" class="numeric current-yield-column">静态股息率</th>
                <th scope="col" class="action-column">
                  <span class="sr-only">操作</span>
                </th>
              </tr>
            </thead>
            <tbody id="stockRows">
              <tr class="loading-row">
                <td colspan="8">
                  <span class="spinner" aria-hidden="true"></span>
                  正在读取行情
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <nav class="pagination" aria-label="股票列表分页">
          <span id="pageStatus">第 1 / 1 页</span>
          <div class="pagination-actions">
            <button id="previousPageButton" class="icon-button subtle" type="button" title="上一页" aria-label="上一页">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6" /></svg>
            </button>
            <button id="nextPageButton" class="icon-button subtle" type="button" title="下一页" aria-label="下一页">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
            </button>
          </div>
        </nav>
      </section>
    </main>

    <dialog id="addDialog" aria-labelledby="dialogTitle">
      <form id="addForm" method="dialog">
        <div class="dialog-heading">
          <div>
            <h2 id="dialogTitle">添加股票</h2>
            <p>沪深 A 股名称或代码</p>
          </div>
          <button
            id="closeDialogButton"
            class="icon-button subtle"
            type="button"
            title="关闭"
            aria-label="关闭"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
          </button>
        </div>
        <label for="stockQuery">股票名称或 6 位代码</label>
        <input
          id="stockQuery"
          name="stockQuery"
          type="text"
          autocomplete="off"
          maxlength="20"
          placeholder="例如 平安银行 / 000001"
          aria-controls="stockSuggestionPanel"
          aria-expanded="false"
          required
        />
        <div
          id="stockSuggestionPanel"
          class="stock-suggestion-panel"
          role="listbox"
          aria-label="匹配股票"
          aria-live="polite"
          hidden
        ></div>
        <p id="formError" class="form-error" role="alert"></p>
        <button id="confirmAddButton" class="primary-button full-width" type="submit">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M5 12h14" /><path d="M12 5v14" /></svg>
          <span>加入自选</span>
        </button>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <noscript>此页面需要启用 JavaScript 才能读取行情。</noscript>
  </body>
</html>
