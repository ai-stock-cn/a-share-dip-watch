<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A股自选股当日跌幅与静态股息率看板"
    />
    <meta name="theme-color" content="#17201c" />
    <title>A股回撤观察</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <header class="app-header">
      <div class="header-inner">
        <div class="brand-block">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>A股回撤观察</h1>
            <p id="marketStatus" class="market-status">正在读取行情</p>
          </div>
        </div>
        <div class="header-actions">
          <button
            id="refreshButton"
            class="icon-button"
            type="button"
            title="刷新行情"
            aria-label="刷新行情"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 0 0-15.2-6.2L3 8" />
              <path d="M3 3v5h5" />
              <path d="M3 12a9 9 0 0 0 15.2 6.2L21 16" />
              <path d="M16 16h5v5" />
            </svg>
          </button>
          <button id="addButton" class="primary-button" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M5 12h14" /><path d="M12 5v14" /></svg>
            <span>添加股票</span>
          </button>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section class="summary-strip" aria-label="自选股概览">
        <div>
          <span class="summary-label">自选股</span>
          <strong id="stockCount">--</strong>
        </div>
        <div>
          <span class="summary-label">下跌</span>
          <strong id="declineCount">--</strong>
        </div>
        <div>
          <span class="summary-label">跌超 3%</span>
          <strong id="alertCount">--</strong>
        </div>
        <div class="summary-time">
          <span class="summary-label">更新时间</span>
          <strong id="updatedAt">--</strong>
        </div>
      </section>

      <section class="watchlist-section" aria-labelledby="watchlistTitle">
        <div class="section-heading">
          <h2 id="watchlistTitle">今日表现</h2>
          <div class="legend" aria-label="跌幅颜色说明">
            <span><i class="legend-dot moderate"></i>跌 3%+</span>
            <span><i class="legend-dot severe"></i>跌 5%+</span>
          </div>
        </div>

        <div class="table-shell">
          <table>
            <thead>
              <tr>
                <th scope="col">股票</th>
                <th scope="col" class="numeric">当日跌幅</th>
                <th scope="col" class="numeric">静态股息率</th>
                <th scope="col" class="action-column">
                  <span class="sr-only">操作</span>
                </th>
              </tr>
            </thead>
            <tbody id="stockRows">
              <tr class="loading-row">
                <td colspan="4">
                  <span class="spinner" aria-hidden="true"></span>
                  正在读取行情
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <dialog id="addDialog" aria-labelledby="dialogTitle">
      <form id="addForm" method="dialog">
        <div class="dialog-heading">
          <div>
            <h2 id="dialogTitle">添加股票</h2>
            <p>沪深 A 股代码</p>
          </div>
          <button
            id="closeDialogButton"
            class="icon-button subtle"
            type="button"
            title="关闭"
            aria-label="关闭"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
          </button>
        </div>
        <label for="stockCode">6 位股票代码</label>
        <input
          id="stockCode"
          name="stockCode"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          maxlength="6"
          pattern="[0-9]{6}"
          placeholder="例如 601318"
          required
        />
        <p id="formError" class="form-error" role="alert"></p>
        <button id="confirmAddButton" class="primary-button full-width" type="submit">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M5 12h14" /><path d="M12 5v14" /></svg>
          <span>加入自选</span>
        </button>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <noscript>此页面需要启用 JavaScript 才能读取行情。</noscript>
  </body>
</html>
