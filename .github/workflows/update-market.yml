name: Update market data

on:
  schedule:
    - cron: "*/15 1-7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh quotes and dividends
        run: python scripts/update_market.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/dividends.json
          if git diff --cached --quiet; then
            echo "No market data changes"
          else
            git commit -m "data: refresh A-share market snapshot"
            git push
          fi
